<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img" aria-labelledby="t">
  <title id="t">En cifras: 2 webs entregadas a clientas reales; 99 a 100 en Lighthouse en celular (Calis Trainer); 20 pruebas end-to-end (Polar Canvas); 93 % menos de tiempo con Redis en BookLibre, con datos de prueba.</title>
  <rect x="1" y="1" width="1198" height="178" rx="20" fill="#F5F0E4" stroke="#D9D1BC" stroke-width="2"/>
  <g font-family="'DM Sans','Helvetica Neue',Arial,sans-serif">

  <text x="40" y="95" font-size="54" font-weight="700" letter-spacing="-1" fill="#4B3FA0" textLength="34" lengthAdjust="spacingAndGlyphs">2</text>
  <text x="40" y="128" font-size="17" fill="#1B1A20">webs entregadas</text>
  <text x="40" y="150" font-size="15" fill="#5B574F">a clientas reales</text>
<line x1="300" y1="30" x2="300" y2="150" stroke="#D9D1BC" stroke-width="2"/>
  <text x="340" y="95" font-size="54" font-weight="700" letter-spacing="-1" fill="#4B3FA0" textLength="170" lengthAdjust="spacingAndGlyphs">99–100</text>
  <text x="340" y="128" font-size="17" fill="#1B1A20">Lighthouse en celular</text>
  <text x="340" y="150" font-size="15" fill="#5B574F">Calis Trainer</text>
<line x1="600" y1="30" x2="600" y2="150" stroke="#D9D1BC" stroke-width="2"/>
  <text x="640" y="95" font-size="54" font-weight="700" letter-spacing="-1" fill="#4B3FA0" textLength="68" lengthAdjust="spacingAndGlyphs">20</text>
  <text x="640" y="128" font-size="17" fill="#1B1A20">pruebas end-to-end</text>
  <text x="640" y="150" font-size="15" fill="#5B574F">Polar Canvas</text>
<line x1="900" y1="30" x2="900" y2="150" stroke="#D9D1BC" stroke-width="2"/>
  <text x="940" y="95" font-size="54" font-weight="700" letter-spacing="-1" fill="#4B3FA0" textLength="170" lengthAdjust="spacingAndGlyphs">93 %</text>
  <text x="940" y="128" font-size="17" fill="#1B1A20">menos tiempo con Redis</text>
  <text x="940" y="150" font-size="15" fill="#5B574F">BookLibre, datos de prueba</text>
  </g>
</svg>
